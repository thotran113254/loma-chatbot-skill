# OpenAI-specific skill metadata (ChatGPT desktop app / Codex).
# Ignored by Claude clients, which read SKILL.md only.
interface:
  display_name: "Chatbot Ops"
  short_description: "Run a live chatbot: channels, conversations, leads, orders, follow-up, analytics."
  default_prompt: "Check how my chatbot is doing and tell me what to fix."

policy:
  # Same as chatbot-builder: false makes the skill invisible to Codex/ChatGPT (verified
  # 260726, Codex 0.145). Customer-visible actions stay gated by MCP approvals and the
  # confirmation rules in SKILL.md.
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "chatbot"
      description: "Chatbot platform MCP server — replace the URL with your own MCP_API_BASE from the dashboard (Settings -> AI Connect) and authenticate with your MCP token."
      transport: "streamable_http"
      url: "https://REPLACE-WITH-YOUR-API-BASE/api/mcp-server"
